[package]
name = "keyword-title-tool"
version = "0.6.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
base64 = "0.22"
keyword-title-core = { path = "../../core" }

# 自動切段的 OCR（Windows 內建繁體中文 OCR）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections"] }

[[bin]]
name = "keyword-title-tool"
path = "src/main.rs"
