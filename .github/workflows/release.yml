name: Release

# 推 v* 標籤就會：跑測試 → 建置 Windows 安裝檔 → 用 updater 金鑰簽章 → 發布到 GitHub Release
# （含 latest.json）。已安裝的程式開啟時會讀 latest.json，有新版就提示更新。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 跟本機一樣跑 scripts/check.ps1（測試＋clippy＋JS 檢查），沒過就不打包。
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私鑰只存在 repo secret，不進 git。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 關鍵標題整理工具 ${{ github.ref_name }}
          # 標籤指向的 commit 訊息（scripts/release.sh 寫的「版本 x.y.z：說明」）當更新說明，
          # App 的更新提示會顯示第一行。發布後也可以直接在 GitHub 上改。
          releaseBody: |
            ${{ github.event.head_commit.message }}

            ---
            安裝後首次啟動若出現「Windows 已保護您的電腦」，請點「其他資訊」→「仍要執行」
            （此程式未購買程式碼簽章憑證，屬預期行為）。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
